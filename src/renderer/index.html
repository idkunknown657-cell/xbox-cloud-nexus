<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https:; font-src 'self' data:" />
  <title>Xbox Cloud Nexus</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="styles-extra.css" />
  <link rel="stylesheet" href="styles-controls.css" />
  <link rel="icon" href="icons/icon-32.png" />
</head>
<body>
  <div id="app">
    <div class="titlebar" id="titlebar">
      <div class="tb-brand"><img src="icons/icon-32.png" alt="" /> <span data-i18n="appName">Xbox Cloud Nexus</span></div>
      <div class="tb-space"></div>
      <div class="tb-brand right">
        <span class="tb-net" id="tb-net" title="Network"><i class="dot"></i></span>
        <span class="tb-pad" id="tb-pad" title="Controller"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M7 8h10a4 4 0 0 1 4 4v1a3 3 0 0 1-5.6 1.5L13 12h-2l-2.4 2.5A3 3 0 0 1 3 13v-1a4 4 0 0 1 4-4Z"/><path d="M7 11v3M5.5 12.5h3M16 11.5h.01M18.5 13h.01"/></svg></span>
      </div>
      <button class="tb-btn" id="tb-min" title="Minimize" aria-label="Minimize"><svg viewBox="0 0 12 12" width="10" height="10" stroke="currentColor" stroke-width="1.2"><line x1="1" y1="6" x2="11" y2="6"/></svg></button>
      <button class="tb-btn" id="tb-max" title="Maximize" aria-label="Maximize"><svg viewBox="0 0 12 12" width="10" height="10" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="1.5" y="1.5" width="9" height="9"/></svg></button>
      <button class="tb-btn close" id="tb-close" title="Close" aria-label="Close"><svg viewBox="0 0 12 12" width="10" height="10" stroke="currentColor" stroke-width="1.4"><line x1="1.5" y1="1.5" x2="10.5" y2="10.5"/><line x1="10.5" y1="1.5" x2="1.5" y2="10.5"/></svg></button>
    </div>
    <nav class="sidebar" id="sidebar" aria-label="Main navigation"></nav>
    <main class="main" id="main" tabindex="-1"></main>
  </div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div id="overlays"></div>
  <script src="js/app.js" type="module"></script>
</body>
</html>
